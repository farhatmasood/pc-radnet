# Environment used for training, evaluation and the analysis scripts.
# Versions are those of the tested setup (Python 3.10, PyTorch 2.5.1, CUDA 12.1).
name: pc_radnet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - scipy=1.15.1
  - matplotlib=3.10.0
  - seaborn=0.13.2
  - pillow
  - pyyaml
  - tqdm
  - pip
  - pip:
    - timm==1.0.22
    - peft==0.13.2
    - albumentations==2.0.8
    - opencv-python==4.11.0.86
    - monai==1.4.0                 # SwinUNETR baseline
    - segment-anything==1.0        # SAM baselines
    - SimpleITK==2.4.0             # SPIDER and SpineWeb volumes
    - nibabel==5.3.2
    - pydicom==3.0.1               # RSNA 2024 DICOM series
    - umap-learn==0.5.11
    - sentence-transformers        # all-MiniLM-L6-v2 and MedCPT retrieval
    - faiss-cpu
    - nltk==3.9.4
    - rouge-score==0.1.2
    - bert-score==0.3.13           # RoBERTa-large, layer 17, lang="en" defaults
    - transformers                 # language-model report baselines
    - accelerate
    - bitsandbytes                 # 4-bit loading of the 7B/8B baselines
    - huggingface-hub
    - hydra-core==1.3.2            # MedSAM2
    - wandb==0.23.1

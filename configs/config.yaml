project:
  name: "PC-RadNet"
  seed: 42

hardware:
  gpu_fraction: 0.80          # share of GPU memory the training process may allocate
  num_workers: 2
  pin_memory: true
  grad_checkpoint: true
  precision: "bf16"

# Relative paths are resolved against the repository root (scripts/repo_config.py).
paths:
  dataset_root: "data/LSMA-PQR"            # local copy of the LSMA-PQR release
  images: "data/LSMA-PQR/images_png"
  labels: "data/LSMA-PQR/labels_yolo"
  masks: "data/LSMA-PQR/masks_indexed"
  metadata:
    pfirrmann_csv: "data/LSMA-PQR/PfirrmannGrade.csv"
    ivd_heights_csv: "data/LSMA-PQR/IVDHeights.csv"
    structured_notes_csv: "data/LSMA-PQR/structured_notes.csv"
    structured_reports_csv: "data/LSMA-PQR/structured_reports.csv"
    notes_csv: "data/LSMA-PQR/notes.csv"
  report_folder: "data/LSMA-PQR/Report"
  splits_dir: "data"                       # train.txt, val.txt, test.txt
  scripts: "scripts"
  checkpoints: "checkpoints"
  results: "results"
  figures: "results/figures"
  faiss_index: "checkpoints/faiss_rag_index.bin"
  faiss_meta: "checkpoints/faiss_metadata.json"
  pretrained:
    sam_vit_b: "checkpoints/pretrained/sam_vit_b_01ec64.pth"   # Segment Anything ViT-B release
    medsam2_root: "third_party/MedSAM2"                       # clone of the MedSAM2 repository
  # External cohorts (leave empty to skip a dataset)
  external_datasets:
    spider: ""        # SPIDER (Zenodo record 10159290)
    rsna: ""          # RSNA 2024 Lumbar Spine Degenerative Classification
    spine_new: ""     # SpineParseNet data
    spineweb: ""      # SpineWeb Dataset 11
    xray: ""          # optional radiograph cohort used by evaluate_external.py

classes:
  # Masks are indexed per plane:
  # axial    0=BG, 1=IVD, 2=PE, 3=SC
  # sagittal 0=BG, 1=VB, 2=IVD_sag, 3=Sacrum, 4=SC_sag
  axial: {0: "Background", 1: "IVD", 2: "PE", 3: "SC"}
  sagittal: {0: "Background", 1: "VB", 2: "IVD_sag", 3: "Sacrum", 4: "SC_sag"}
  num_axial_classes: 4
  num_sagittal_classes: 5
  num_classes_no_bg: 7

dataset:
  total_images: 4120
  total_patients: 515
  images_per_patient: 8       # 3 axial T1w + 3 axial T2w + 1 sagittal T1w + 1 sagittal T2w
  image_size: [384, 384]
  views: ["axial_T1", "axial_T2", "sag_T1", "sag_T2"]
  levels_axial: ["D3", "D4", "D5"]   # L3-L4, L4-L5, L5-S1
  split_ratio: {train: 0.70, val: 0.15, test: 0.15}
  filename_convention: "{view}_{sequence}_{patient_id:04d}_{level}.png"

model:
  backbone: "vit_base_patch14_dinov2.lvd142m"
  adapter_rank: 32            # Spine Domain Adapter bottleneck
  lora_rank: 8                # LoRA rank (alpha = 16, dropout 0.05)
  calibrator_dim: 256

training:
  phase1_epochs: 5
  phase2_epochs: 50
  batch_size: 2
  grad_accum: 8               # effective batch size 16
  lr: 1.0e-4                  # phase 1
  lr_phase2: 5.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  early_stop_patience: 10
  early_stop_monitor: "val_mDice"

loss:
  boundary_lambda: 0.2        # 1.0 for variant A3
  ordinal_lambda: 0.1         # monotonicity penalty of the grading loss
  task_weights:
    seg: 1.0                  # multi-class and prompted segmentation
    grade: 0.5
    height: 0.3
    disorder: 0.5

wandb:
  entity: null
  project: "PC-RadNet"
